<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barbería Monkey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-box">
        <img src="fotos/ocho.jpg" alt="Logo Barbería Monkey" class="logo-login">
        <h2>Barbería Monkey</h2>
        <p>Iniciar sesión</p>

        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Usuario o correo">
            <input type="password" id="clave" placeholder="Contraseña">
            <p id="errorLogin" class="error"></p>
            <button type="submit" class="boton">Ingresar</button>
        </form>
        <small>Usuario: <b>admin</b> | Clave: <b>1234</b></small>
    </div>

    <script src="script.js"></script>
</body>
</html>
